spring.application.name=agentcore-review-demo-app
server.port=${PORT:8080}
# The service runs behind a gateway, so honour its forwarding headers (the gateway has to strip
# client-supplied ones) instead of seeing the proxy address for every caller.
server.forward-headers-strategy=framework
spring.mvc.problemdetails.enabled=true

spring.datasource.url=jdbc:h2:mem:orders
spring.jpa.open-in-view=false
