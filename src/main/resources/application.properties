spring.application.name=agentcore-review-demo-app
server.port=${PORT:8080}
# The service runs behind a gateway, so honour its forwarding headers instead of seeing the proxy
# address for every caller - but only when the request's immediate peer is a trusted proxy. The
# native strategy uses Tomcat's RemoteIpValve, which ignores Forwarded/X-Forwarded-* from any other
# peer, so clients cannot spoof them to pick their own rate-limit key. Set TRUSTED_PROXIES to the
# regular expression matching the gateway addresses; "(?!)" matches no address at all, so an
# unconfigured deployment always uses the real peer address.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:(?!)}
spring.mvc.problemdetails.enabled=true

spring.datasource.url=jdbc:h2:mem:orders
spring.jpa.open-in-view=false
